name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      # GHSA-hp3w-g68c-fv3c (sprintf-js DoS, moderate): no fixed release exists
      # upstream — 1.1.3 is the latest and still inside the vulnerable range —
      # and the chain is build/test tooling only (argparse, via js-yaml and
      # @tensorflow/tfjs). Drop this --ignore once a patched sprintf-js ships.
      - name: Dependency audit
        run: bun audit --prod --ignore=GHSA-hp3w-g68c-fv3c

      - name: Build
        run: bun run build
